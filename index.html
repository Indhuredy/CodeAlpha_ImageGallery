
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Image Gallery</h1>

<div class="gallery">
  <img src="https://picsum.photos/id/1015/300/200" onclick="openLightbox(0)">
  <img src="https://picsum.photos/id/1016/300/200" onclick="openLightbox(1)">
  <img src="https://picsum.photos/id/1018/300/200" onclick="openLightbox(2)">
  <img src="https://picsum.photos/id/1020/300/200" onclick="openLightbox(3)">
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>

  <button class="prev" onclick="prevImage()">❮</button>

  <img id="lightbox-img">

  <button class="next" onclick="nextImage()">❯</button>
</div>

<script src="script.js"></script>
</body>
</html>
